version: '3.8'

services:
  # 1. MySQL Veritabanı Servisi
  db:
    image: mysql:8.0
    container_name: harf_hesaplama_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      MYSQL_DATABASE: ${DB_NAME:-harf_hesaplama}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 2. Spring Boot Backend Servisi
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: harf_hesaplama_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/$${DB_NAME:-harf_hesaplama}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=false
      - SPRING_DATASOURCE_USERNAME=$${DB_USERNAME:-root}
      - SPRING_DATASOURCE_PASSWORD=$${DB_PASSWORD:?DB_PASSWORD must be set}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      db:
        condition: service_healthy

  # 3. Nginx Frontend Servisi
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: harf_hesaplama_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
