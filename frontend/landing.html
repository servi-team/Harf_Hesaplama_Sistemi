<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Harf Hesaplama - Giriş</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/landing.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background-gradient"></div>

    <div class="landing-container">
        <header class="landing-header">
            <div class="icon-wrapper">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
                    <path d="M6 12v5c3 3 9 3 12 0v-5" />
                </svg>
            </div>
            <h1 class="title">Harf Hesaplama Sistemi</h1>
            <p class="subtitle">Lütfen giriş türünü seçiniz</p>
        </header>

        <!-- Kartlar Ekranı -->
        <div class="cards-grid two-cols" id="cards-view">
            <!-- Misafir Kartı -->
            <div class="card" onclick="selectUserType('guest')">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </div>
                <h3>Ziyaretçi</h3>
                <p>Giriş yapmadan dersleri inceleyin. Yorum yapma ve oylama kapalıdır.</p>
                <div class="card-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </div>
            </div>

            <!-- Giriş Yap Kartı (Tek form — rol otomatik belirlenir) -->
            <div class="card student-card" onclick="showLoginForm()">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                        <polyline points="10 17 15 12 10 7"></polyline>
                        <line x1="15" y1="12" x2="3" y2="12"></line>
                    </svg>
                </div>
                <h3>Giriş Yap</h3>
                <p>E-posta ve şifrenizle giriş yapın. Rolünüz otomatik belirlenir.</p>
                <div class="card-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Giriş Formu (Başlangıçta gizli) -->
        <div class="login-form-container" id="login-view" style="display: none;">
            <div class="login-card-form">
                <!-- Giriş / Kaydol Sekmeleri -->
                <div class="auth-tabs">
                    <button type="button" class="auth-tab-btn active" id="tab-login-btn" onclick="switchAuthTab('login')">
                        🔑 Giriş Yap
                    </button>
                    <button type="button" class="auth-tab-btn" id="tab-register-btn" onclick="switchAuthTab('register')">
                        📝 Kaydol
                    </button>
                </div>

                <div class="login-form-header">
                    <div class="login-form-icon" id="login-form-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="28" height="28">
                            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                            <polyline points="10 17 15 12 10 7"></polyline>
                            <line x1="15" y1="12" x2="3" y2="12"></line>
                        </svg>
                    </div>
                    <h2 id="login-form-header-title">Giriş Yap</h2>
                    <p class="login-form-subtitle" id="login-form-header-subtitle">E-posta ve şifrenizi girin — rolünüz otomatik belirlenir</p>
                </div>

                <div class="login-form-body">
                    <!-- Giriş Yap Alanları -->
                    <div id="login-fields">
                        <div class="form-group">
                            <label for="login-email">E-posta</label>
                            <div class="input-wrapper">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                    <polyline points="22,6 12,13 2,6"></polyline>
                                </svg>
                                <input type="email" id="login-email" placeholder="ornek@edu.tr" autocomplete="email">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="login-password">Şifre</label>
                            <div class="input-wrapper">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                                <input type="password" id="login-password" placeholder="••••••" autocomplete="current-password">
                            </div>
                        </div>

                        <button class="btn-login" onclick="attemptLogin()" style="margin-top: 0.5rem;">
                            <span>Giriş Yap</span>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                                <polyline points="12 5 19 12 12 19"></polyline>
                            </svg>
                        </button>
                    </div>

                    <!-- Kaydol Alanları (Öğrenci) -->
                    <div id="register-fields" style="display: none;">
                        <div class="form-group">
                            <label for="reg-fullname">Ad Soyad</label>
                            <div class="input-wrapper">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                                <input type="text" id="reg-fullname" placeholder="Örn: Ali Yılmaz" autocomplete="name">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="reg-email" style="display: flex; justify-content: space-between; align-items: center;">
                                <span>Öğrenci E-postası</span>
                                <span style="font-size: 0.68rem; color: var(--primary-light); font-weight: 500;">🎓 Sadece .edu.tr</span>
                            </label>
                            <div class="input-wrapper">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                    <polyline points="22,6 12,13 2,6"></polyline>
                                </svg>
                                <input type="email" id="reg-email" placeholder="kullanici@std.yildiz.edu.tr" autocomplete="email">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="reg-password">Şifre</label>
                            <div class="input-wrapper">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                                <input type="password" id="reg-password" placeholder="••••••" autocomplete="new-password">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="reg-password-confirm">Şifre Tekrarı</label>
                            <div class="input-wrapper">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                                <input type="password" id="reg-password-confirm" placeholder="••••••" autocomplete="new-password">
                            </div>
                        </div>

                        <button class="btn-login" onclick="attemptRegister()" style="background: linear-gradient(135deg, var(--secondary), var(--primary)); margin-top: 0.5rem;">
                            <span>Kayıt Ol ve Başla</span>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                                <polyline points="12 5 19 12 12 19"></polyline>
                            </svg>
                        </button>
                    </div>

                    <!-- Ortak Hata Kutusu -->
                    <div class="login-error" id="login-error" style="display: none;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="15" y1="9" x2="9" y2="15"></line>
                            <line x1="9" y1="9" x2="15" y2="15"></line>
                        </svg>
                        <span id="login-error-text"></span>
                    </div>

                    <button class="btn-back-login" onclick="backToCards()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                            <path d="M19 12H5" />
                            <path d="M12 19l-7-7 7-7" />
                        </svg>
                        Geri Dön
                    </button>

                    <!-- Demo Bilgileri (Sadece Giriş Yap sekmelisinde) -->
                    <div class="demo-credentials" id="demo-credentials">
                        <!-- JS tarafından doldurulacak -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/mock-data.js"></script>
    <script src="js/entry.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const selectedUni = localStorage.getItem('selectedUniversity') || 'itu';
            const selectedDept = localStorage.getItem('selectedDepartment') || 'bilgisayar-muhendisligi';
            const isLogout = new URLSearchParams(window.location.search).get('logout') === 'true';

            // Eğer özel olarak 'Çıkış Yap' tıklanıp logout=true ile gelinmediyse, doğrudan ana sayfaya yönlendir!
            if (!isLogout) {
                if (!localStorage.getItem('userType')) localStorage.setItem('userType', 'student');
                localStorage.setItem('selectedUniversity', selectedUni);
                localStorage.setItem('selectedDepartment', selectedDept);
                window.location.replace('main.html');
            }
        });
    </script>
</body>

</html>
