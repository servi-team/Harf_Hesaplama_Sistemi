<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harf Hesaplama Sistemi</title>
    <script>
        // Router Mantığı
        function checkAuth() {
            let userType = localStorage.getItem('userType');
            let selectedUni = localStorage.getItem('selectedUniversity');
            let selectedDept = localStorage.getItem('selectedDepartment');

            if (!selectedUni) {
                selectedUni = 'itu';
                localStorage.setItem('selectedUniversity', 'itu');
            }
            if (!selectedDept) {
                selectedDept = 'bilgisayar-muhendisligi';
                localStorage.setItem('selectedDepartment', 'bilgisayar-muhendisligi');
            }
            if (!userType) {
                userType = 'student';
                localStorage.setItem('userType', 'student');
            }

            // Her şey hazır -> Doğrudan Ana Sayfaya git
            window.location.replace('main.html');
        }

        checkAuth();
    </script>
</head>

<body>
    <p>Yönlendiriliyorsunuz...</p>
</body>

</html>
